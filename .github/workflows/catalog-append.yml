name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append
        run: |
          python3 - <<'PY'
          import csv

          ROWS = [
            ["Mini Rocket","assets-3d-lowpoly","mini-rocket/mini_rocket.zip","3D 모델","scifi,rocket,missile,weapon,3d,lowpoly","David W CG","https://opengameart.org/content/mini-rocket","CC0","없음","2026-11-13","zip 1.7MB(blend·glb·PBR 텍스처 포함); CC0 단독; AI 생성 언급 없음"],
            ["3D Sara - Wizard","assets-3d-lowpoly","3d-sara-wizard/sara_glb.zip","3D 모델","sara,mascot,wizard,character,rigged,animated,3d,lowpoly","Mish7913","https://opengameart.org/content/3d-sara-wizard","CC-BY 3.0","3D model created by Mish7913, based on Mandi Paugh image.","2026-11-13","sara.blend 2.6MB·sara_fbx.zip 3.2MB·sara_glb.zip 1.6MB 함께 수록; CC-BY 3.0; CREDITS.txt 동봉; AI 생성 언급 없음"],
            ["Animated Charged Bolt","assets-2d-pixel","animated-charged-bolt/hjm-charged_bolt_v4_0.zip","2D 이펙트","magic,spell,bolt,projectile,effect,animated,2d","Varkalandar","https://opengameart.org/content/animated-charged-bolt","CC-BY 4.0","For attribution, please state my name, Hansjörg Malthaner, and link here: http://opengameart.org/users/varkalandar","2026-11-13","48프레임 PNG 400x300; zip 4.2MB; 페이지 표기 중 CC-BY 4.0으로 수록; CREDITS.txt 동봉; AI 생성 언급 없음"],
          ]

          with open("catalog.csv", "a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              for r in ROWS:
                  w.writerow(r)

          S = "\n".join([
            "## 2026-11-13 A76 추가 (3팩, 총 1838팩)",
            "",
            "A76 라운드에서 OpenGameArt 3D 최신순의 3D 2팩 Mini Rocket·3D Sara - Wizard와 2D 마법 이펙트 최신순의 Animated Charged Bolt(모두 opengameart.org)를 수집했습니다. 중복은 라이브러리 검색(https://sigco3111.github.io/game-asset-catalog/)에서 제목으로 확인했고(모두 신규; Mini Shop·Mini Forest·Modular Cave Kit·Pine Tree·Mushroom Enemy·Weapon Slash - Effect·Earth Impact - Magic Effect·Tiny Magic Glyphs·Pure Projectile·150 Combat Sound Effects는 이미 수록되어 제외, Dungeon Building Kit은 tar.gz 31.4MB라 이번 라운드에서 제외), 각 페이지의 라이선스 표기·파일·AI 언급 여부를 확인했습니다(AI 생성 언급 없음). 3팩 모두 zip 5MB 이하라 저장소 트리에 올렸습니다.",
            "",
            "| 팩 | 라이선스 |",
            "| --- | --- |",
            "| [Mini Rocket](https://opengameart.org/content/mini-rocket) | CC0 |",
            "| [3D Sara - Wizard](https://opengameart.org/content/3d-sara-wizard) | CC-BY 3.0 |",
            "| [Animated Charged Bolt](https://opengameart.org/content/animated-charged-bolt) | CC-BY 4.0 |",
            "",
            "종류: 3D 2팩(assets-3d-lowpoly; 무기 소품 1·캐릭터 1), 2D 이펙트 1팩(assets-2d-pixel). 라이선스: CC0 1팩, CC-BY 3.0 1팩, CC-BY 4.0 1팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 ingest-pack.yml 수동 실행). 용량(GitHub API size): assets-3d-lowpoly 약 566MB, assets-2d-pixel 약 379MB(모두 700MB 미만), 새 저장소 생성 없음. 색인(assets-index*.json)·위키·llms.txt는 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.",
            "",
          ])

          readme = open("README.md", encoding="utf-8").read()
          readme = readme.replace("1,835개 에셋", "1,838개 에셋")
          marker = "## 2026-11-13 A75 추가 (3팩, 총 1835팩)"
          assert marker in readme
          readme = readme.replace(marker, S + marker, 1)
          open("README.md", "w", encoding="utf-8").write(readme)

          with open("docs/log.md", "a", encoding="utf-8") as f:
              f.write("- 2026-11-13 A76: Mini Rocket·3D Sara - Wizard·Animated Charged Bolt (3팩, 총 1838팩; 3D 2팩 CC0·CC-BY 3.0·2D 1팩 CC-BY 4.0)\n")

          print("ok")
          PY
      - name: commit
        run: |
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "카탈로그: A76 3팩 추가"
          git push

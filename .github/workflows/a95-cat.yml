name: a95-cat
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe, catalog or cleanup
        required: true
        default: probe
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq imagemagick unzip >/dev/null 2>&1 || true
      - name: run
        env:
          MODE: ${{ inputs.mode }}
        run: python3 tools/a95.py

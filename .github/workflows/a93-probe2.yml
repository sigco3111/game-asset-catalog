name: a93-probe2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, json

          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0 a93"})
              return urllib.request.urlopen(r, timeout=40).read().decode("utf-8","ignore")

          # 3D repo size
          try:
              req = urllib.request.Request("https://api.github.com/repos/sigco3111/assets-3d-lowpoly-2",
                                           headers={"Authorization":"token "+__import__("os").environ.get("GITHUB_TOKEN",""),
                                                    "User-Agent":"a93"})
              j = json.load(urllib.request.urlopen(req, timeout=30))
              size_mb = round(j.get("size",0)/1024.0,1)
          except Exception as e:
              size_mb = "ERR " + str(e)[:60]

          listings = []
          for p in (3, 4, 5, 6, 7):
              listings.append("https://opengameart.org/art-search-advanced?keys=&field_art_type_tid%%5B%%5D=10&sort_by=count&sort_order=DESC&page=%d" % p)
          for kw in ("spell effect", "explosion", "slash", "magic sound effect", "hit effect"):
              listings.append("https://opengameart.org/art-search-advanced?keys=" + urllib.parse.quote(kw) + "&sort_by=count&sort_order=DESC")

          urls = []
          for l in listings:
              try:
                  html = get(l)
              except Exception as e:
                  print("LISTFAIL", l, e); continue
              for m in re.findall(r'href="/content/([a-z0-9][a-z0-9\-]+)"', html):
                  u = "https://opengameart.org/content/" + m
                  if u not in urls:
                      urls.append(u)
          print("listing urls", len(urls))

          body = open("catalog.csv", encoding="utf-8").read()
          low = body.lower()

          LICMAP = [("cc0","CC0"),("cc-by","CC-BY"),("cc-by-3","CC-BY"),("cc-by-4","CC-BY"),("gpl","GPL"),("mit","MIT")]
          rows = []
          for u in urls[:60]:
              try:
                  h = get(u)
              except Exception as e:
                  continue
              t = re.search(r'<h1[^>]*>(.*?)</h1>', h, re.S)
              name = re.sub(r"<[^>]+>", "", t.group(1)).strip() if t else ""
              if not name:
                  t2 = re.search(r"<title>(.*?)</title>", h, re.S)
                  name = re.sub(r"\s*[|\-]\s*OpenGameArt\.org.*$", "", t2.group(1)).strip() if t2 else u.rsplit("/",1)[-1]
              name = re.sub(r"\s+", " ", name)
              lic = set()
              for l in re.findall(r'href="/licenses/([a-z0-9\-]+)"', h):
                  for k, v in LICMAP:
                      if l.startswith(k):
                          lic.add(v)
              lics = "/".join(sorted(lic)) if lic else ""
              au = re.search(r'/users/([A-Za-z0-9_\-\.]+)', h)
              author = au.group(1) if au else ""
              files = re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+?\.(?:zip|7z|rar))"', h)
              blend = re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+?\.blend)"', h)
              att = files[0] if files else (blend[0] if blend else "")
              dup = ('"' + name.lower() + '",') in low or ("\n" + name.lower() + ",") in low
              if not lics:
                  lics = "UNKNOWN"
              rows.append((name, u, lics, author, att, "DUP" if dup else "NEW"))

          out = ["SIZE3D|" + str(size_mb) + "|MB"]
          for r in rows:
              out.append("|".join(r))
          nn = sum(1 for r in rows if r[5] == "NEW")
          out.append("TOTAL|" + str(len(rows)) + "|NEW|" + str(nn))
          open("a93-probe.txt","w",encoding="utf-8").write("\n".join(out) + "\n")
          print("\n".join(out))

          PY
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          git add a93-probe.txt
          git commit -q -m "A93: 후보 대조"
          git push origin HEAD:main

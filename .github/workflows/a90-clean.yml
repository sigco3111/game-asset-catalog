name: a90-clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git rm -q -r --ignore-unmatch .github/workflows/a90-*.yml .github/scripts/a90*.py
          git commit -m "A90: 임시 파일 삭제"
          git push origin HEAD:main

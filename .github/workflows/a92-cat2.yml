name: a92-cat2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess

          packs = [
          dict(name="Modular Medieval House Pack 01", repo="assets-3d-lowpoly-2", slug="modular-medieval-house-pack-01", typ="3D 건물", tags="building,medieval,modular,lowpoly", author="hreikin", src="https://opengameart.org/content/modular-medieval-house-pack-01", lic="CC0", why="n16 medieval-house"),
          dict(name="Retro Medieval Kit", repo="assets-3d-lowpoly-2", slug="retro-medieval-kit", typ="3D 환경", tags="medieval,retro,lowpoly,kenney", author="Kenney", src="https://opengameart.org/content/retro-medieval-kit", lic="CC0", why="kenney 100 models"),
          dict(name="Stylised Fantasy Weapons", repo="assets-3d-lowpoly-2", slug="stylised-fantasy-weapons", typ="3D 무기", tags="weapon,fantasy,lowpoly,stylised", author="mastahcez", src="https://opengameart.org/content/stylised-fantasy-weapons", lic="CC-BY 3.0", why="7 weapons fbx"),
          dict(name="High resolution slash effects", repo="assets-2d-pixel", slug="high-resolution-slash-effects", typ="2D 이펙트", tags="slash,effect,vfx,hit", author="MetaShinryu", src="https://opengameart.org/content/high-resolution-slash-effects", lic="CC0", why="slash vfx"),
          ]

          def code(u):
              return subprocess.run(["curl","-s","-o","/dev/null","-w","%{http_code}","-I",u], capture_output=True, text=True).stdout.strip()

          body = open("catalog.csv", encoding="utf-8").read()
          lines = body.splitlines()

          added = []
          for p in packs:
              if (p["name"] + ",") in body or ('"' + p["name"] + '",') in body:
                  print("SKIP dup", p["name"]); continue
              base = "https://raw.githubusercontent.com/sigco3111/" + p["repo"] + "/main/"
              ext = ""
              for e in ("zip", "7z", "rar"):
                  if code(base + p["slug"] + "/" + p["slug"] + "." + e) == "200":
                      ext = e; break
              if not ext:
                  print("SKIP nofile", p["name"]); continue
              pv = ""
              for e in ("png", "jpg"):
                  u = base + "previews/" + p["slug"] + "." + e
                  if code(u) == "200":
                      pv = u; break
              notes = p["typ"] + " 팩; OGA 페이지 라이선스 " + p["lic"] + "; 원본 파일 바이트 그대로 보관; 썸네일 preview는 " + ("팩 내 이미지/원본 페이지 미리보기를 480x480 이하로 축소·strip" if pv else "없음")
              added.append([p["name"], p["repo"], p["slug"] + "/" + p["slug"] + "." + ext, p["typ"], p["tags"], p["author"], p["src"], p["lic"], "", "2026-11-14", notes, pv, ""])
              print("ADD", p["name"], ext, "preview" if pv else "NOPREVIEW")

          if not added:
              print("NOTHING ADDED"); raise SystemExit(1)

          with open("catalog.csv", "a", newline="", encoding="utf-8") as f:
              w = csv.writer(f, lineterminator="\n")
              for r in added:
                  w.writerow(r)

          n = len(added)
          total = len([l for l in lines if l.strip()]) - 1 + n
          n3 = sum(1 for r in added if r[3].startswith("3D"))
          n2 = n - n3

          rd = open("README.md", encoding="utf-8").read().splitlines()
          sec = ["## 2026-11-14 A92 추가 (" + str(n) + "팩, 총 " + str(total) + "팩)", ""]
          sec.append("A92 라운드에서 OpenGameArt의 " + ", ".join(r[0] + "(" + r[5] + ", " + r[7] + ")" for r in added) + "를 수집했습니다. OGA 3D 목록 뒷 페이지와 2D 이펙트 태그에서 후보 16개를 뽑아 업로드 전 카탈로그 이름 대조로 걸러낸 결과입니다.")
          sec += ["", "| 팩 | 라이선스 |", "| --- | --- |"]
          sec += ["| " + r[0] + " | " + r[7] + " |" for r in added]
          sec += ["", "종류: 3D " + str(n3) + "팩, 2D 이펙트 " + str(n2) + "팩. 썸네일: " + ", ".join(r[0] + "=" + ("있음" if r[11] else "없음") for r in added) + ". 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.", ""]
          idx = None
          for i, l in enumerate(rd):
              if l.startswith("## 2026-11-14 A91 추가"):
                  idx = i; break
          if idx is None:
              for i, l in enumerate(rd):
                  if l.startswith("## "):
                      idx = i; break
          rd[idx:idx] = sec
          open("README.md", "w", encoding="utf-8").write("\n".join(rd) + "\n")

          entry = "- 2026-11-14 A92: " + ", ".join(r[0] + " (" + r[5] + ", " + r[7] + ")" for r in added) + " (" + str(n) + "팩, 총 " + str(total) + "팩; 3D " + str(n3) + ", 2D 이펙트 " + str(n2) + "). 후보 16개를 카탈로그 이름 대조로 걸러 업로드."
          with open("docs/log.md", "a", encoding="utf-8") as f:
              f.write("\n" + entry + "\n")
          open("a92n.txt", "w").write(str(n))
          print("DONE", n, total)

          PY
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          N=$(cat a92n.txt); rm -f a92n.txt
          git add -A
          git commit -q -m "카탈로그: A92 ${N}팩 추가"
          git push origin HEAD:main

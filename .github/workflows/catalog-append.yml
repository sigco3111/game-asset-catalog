name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 카탈로그 갱신
        run: |
          python3 - <<'PY'
          import csv, io, re, sys
          
          ROWS = [
           ["Lock","assets-3d-lowpoly","lock/lock.zip","3D 소품","lock,low poly,retro,blockbench,3d","Q2DENJINDREW","https://opengameart.org/content/lock-1","CC0","없음","2026-11-13","zip 1KB; CC0 단독; AI 생성 언급 없음"],
           ["Stylized Coin","assets-3d-lowpoly","stylized-coin/coin.blend","3D 소품","coin,gold,stylized,prop,blend,3d","optimuspryne","https://opengameart.org/content/stylized-coin","CC0","없음","2026-11-13","blend 134.4KB; CC0 단독; AI 생성 언급 없음"],
           ["Dice","assets-3d-lowpoly","dice/dice.zip","3D 소품","dice,board game,prop,blender,3d","gearfox98","https://opengameart.org/content/dice-6","CC0","없음","2026-11-13","zip 148.2KB; CC0 단독; AI 생성 언급 없음"],
           ["Pocket Bleeps – 31 Retro 8-Bit SFX","assets-audio","pocket-bleeps/pocket-bleeps-free-sampler-31-sfx-wav-cc-by.zip","효과음","sfx,8-bit,chiptune,retro,hit,explosion,ui","Pocket Bleeps","https://opengameart.org/content/pocket-bleeps-%E2%80%93-31-retro-8-bit-sfx-free-sampler-cc-by","CC-BY 4.0","Pocket Bleeps (OpenGameArt.org)","2026-11-13","zip 97.5KB(WAV 31종); CC-BY 4.0; CREDITS.txt 동봉; AI 생성 언급 없음"],
          ]
          
          with open("catalog.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          header, data = rows[0], rows[1:]
          before = len(data)
          buf = io.StringIO()
          w = csv.writer(buf, lineterminator="\n")
          for r in ROWS:
              w.writerow(r)
          with open("catalog.csv", "a", encoding="utf-8", newline="") as f:
              f.write(buf.getvalue())
          total = before + len(ROWS)
          
          cnt2 = sum(1 for r in data if r[1] == "assets-2d-pixel") + sum(1 for r in ROWS if r[1] == "assets-2d-pixel")
          cnt3 = sum(1 for r in data if r[1] == "assets-3d-lowpoly") + sum(1 for r in ROWS if r[1] == "assets-3d-lowpoly")
          cntui = sum(1 for r in data if r[1] == "assets-ui-icons")
          cnta = sum(1 for r in data if r[1] == "assets-audio") + sum(1 for r in ROWS if r[1] == "assets-audio")
          print("total", total, "2d", cnt2, "3d", cnt3, "ui", cntui, "audio", cnta)
          
          sec = """## 2026-11-13 A78 추가 (4팩, 총 %d팩)
          
          A78 라운드에서 OpenGameArt 3D 최신순의 3D 3팩 Lock·Stylized Coin·Dice와 효과음 1팩 Pocket Bleeps – 31 Retro 8-Bit SFX(모두 opengameart.org)를 수집했습니다. 중복은 라이브러리 검색(https://sigco3111.github.io/game-asset-catalog/)에서 제목으로 확인했습니다(모두 신규; low poly iron ore·Mini Dungeon·flash bang sound·Pixel art sword slash effect·Spark effect는 이미 수록되어 제외; Cartoon Character(s)는 zip 30.9MB로 제외). 4팩 모두 5MB 이하라 저장소 트리에 올렸습니다.
          
          | 팩 | 라이선스 |
          | --- | --- |
          | Lock | CC0 |
          | Stylized Coin | CC0 |
          | Dice | CC0 |
          | Pocket Bleeps – 31 Retro 8-Bit SFX | CC-BY 4.0 |
          
          종류: 3D 3팩(assets-3d-lowpoly; 소품 3), 효과음 1팩(assets-audio). 라이선스: CC0 3팩, CC-BY 4.0 1팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 ingest-pack.yml 수동 실행). 용량(GitHub API size): assets-3d-lowpoly 약 608MB(700MB 미만), assets-audio 약 381MB, 새 저장소 생성 없음. 색인(assets-index*.json)·위키·llms.txt는 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.
          """ % total
          
          rd = open("README.md", encoding="utf-8").read()
          rd = re.sub(r"(게임 에셋 도서관 실제 화면 - )[\d,]+(개 에셋)", lambda m: m.group(1) + format(total, ",") + m.group(2), rd)
          marker = "## 2026-11-13 A77 추가"
          assert marker in rd, "marker missing"
          rd = rd.replace(marker, sec + marker, 1)
          open("README.md", "w", encoding="utf-8", newline="\n").write(rd)
          
          logline = "- 2026-11-13 A78: Lock (Q2DENJINDREW, CC0), Stylized Coin (optimuspryne, CC0), Dice (gearfox98, CC0), Pocket Bleeps – 31 Retro 8-Bit SFX (Pocket Bleeps, CC-BY 4.0) (4팩, 총 %d팩; 3D 3팩 assets-3d-lowpoly + 효과음 1팩 assets-audio; AI 생성 아님). 중복은 라이브러리 검색으로 후보별 확인(low poly iron ore·Mini Dungeon·flash bang sound·Pixel art sword slash effect·Spark effect는 이미 수록, Cartoon Character(s)는 30.9MB로 제외). 팩당 1커밋, 임시 워크플로 ingest-pack.yml 수동 실행. 4팩 모두 5MB 이하(zip/blend)라 저장소 트리에 올림. catalog.csv 4행 추가(%d→%d행)." % (total, before, total)
          with open("docs/log.md", "a", encoding="utf-8", newline="") as f:
              f.write(logline + "\n")
          print("done")
          PY
      - name: 커밋
        run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add -A
          git commit -m "카탈로그: A78 4팩 추가"
          git push

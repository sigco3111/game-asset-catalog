name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          rows = [
            ('City Kit (Roads)','assets-3d-lowpoly','city-kit-roads/city-kit-roads.zip','3D 모델','city,road,kit,modular,kenney','Kenney','https://opengameart.org/content/city-kit-roads','CC0','optional: Kenney (kenney.nl)','2026-11-13','파일 487개; zip 2.8MB; 미리보기 preview.jpg'),
            ('Ghost lady model (UNTEXTURED)','assets-3d-lowpoly','ghost-lady-model-untextured/ghost-lady-model-untextured.zip','3D 모델','ghost,character,untextured,3d','Kabrolkin','https://opengameart.org/content/ghost-lady-model-untextured','CC-BY 4.0','required: Kabrolkin (CC-BY 4.0)','2026-11-13','파일 6개; zip 112KB; CREDITS.txt 포함'),
            ('Packsmithy SFX sampler: 30 synthesised sound effects','assets-audio','packsmithy-sfx-sampler/packsmithy-sfx-sampler.zip','효과음','sfx,ui,retro,horror,sci-fi,glitch','packsmithy','https://opengameart.org/content/packsmithy-sfx-sampler-30-synthesised-sound-effects-ui-retro-horror-sci-fi-glitch','CC-BY 4.0','required: packsmithy (CC-BY 4.0)','2026-11-13','파일 31개; zip 2.0MB; CREDITS.txt 포함'),
          ]
          with open('catalog.csv','a',newline='',encoding='utf-8') as f:
              w = csv.writer(f, lineterminator='\n')
              for r in rows:
                  w.writerow(r)
          total = sum(1 for _ in open('catalog.csv',encoding='utf-8')) - 1
          sec = '''## 2026-11-13 A80 추가 (3팩, 총 %d팩)\n\nA80 라운드에서 OpenGameArt 3D 최신순의 3D 2팩 City Kit (Roads)·Ghost lady model (UNTEXTURED)와 효과음 1팩 Packsmithy SFX sampler: 30 synthesised sound effects(모두 opengameart.org)를 수집했습니다. 중복은 저장소 raw 경로와 카탈로그 코드 검색으로 팩 슬러그를 확인했습니다.\n\n| 팩 | 라이선스 |\n| --- | --- |\n| City Kit (Roads) | CC0 |\n| Ghost lady model (UNTEXTURED) | CC-BY 4.0 |\n| Packsmithy SFX sampler: 30 synthesised sound effects | CC-BY 4.0 |\n\n종류: 3D 2팩(assets-3d-lowpoly; 환경/모듈 1·캐릭터 1), 효과음 1팩(assets-audio). 라이선스: CC0 1팩, CC-BY 4.0 2팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 batch-ingest.yml 수동 실행). 용량: assets-3d-lowpoly 약 612MB, assets-audio 약 385MB(700MB 미만, 새 저장소 생성 없음). 색인(assets-index*.json)·위키·llms.txt는 직접 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.\n\n''' % total
          rd = open('README.md',encoding='utf-8').read()
          idx = rd.find('## 2026-11-13 A79')
          if idx < 0:
              idx = rd.find('## 2026-')
          rd = rd[:idx] + sec + rd[idx:]
          open('README.md','w',encoding='utf-8').write(rd)
          entry = '- 2026-11-13 A80: City Kit (Roads) (Kenney, CC0), Ghost lady model (UNTEXTURED) (Kabrolkin, CC-BY 4.0), Packsmithy SFX sampler: 30 synthesised sound effects (packsmithy, CC-BY 4.0) (3팩, 총 %d팩; 3D 모델 2(assets-3d-lowpoly), 효과음 1(assets-audio)). 소유자 지시의 1회 수집 라운드. OGA 3D 최신순 1~2페이지 후보를 저장소 raw 경로(pack.md 존재)로 중복 확인하고 미수록 2팩을 골랐다. 팩당 zip·pack.md·preview.jpg·LICENSE-SOURCE.txt(+CC-BY 2팩은 CREDITS.txt) 생성, 임시 batch-ingest.yml(workflow_dispatch, ImageMagick 설치)로 실행. catalog.csv 행 3개 추가, README 절 추가, 색인은 Actions 자동 갱신.' % total
          lg = open('docs/log.md',encoding='utf-8').read()
          k = lg.find('A79')
          if k >= 0:
              e = lg.find('\n', k)
              lg = lg[:e+1] + entry + '\n' + lg[e+1:]
          else:
              lg = lg.rstrip('\n') + '\n' + entry + '\n'
          open('docs/log.md','w',encoding='utf-8').write(lg)
          print('total rows', total)
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add catalog.csv README.md docs/log.md
          git commit -m "카탈로그: A80 3팩 추가"
          git push

name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          rows = [
            ('Shipping Containers','assets-3d-lowpoly','shipping-containers/shipping-containers.zip','3D 모델','shipping,container,prop,industrial,3d','miniforall','https://opengameart.org/content/shipping-containers','CC-BY 4.0','required: miniforall (CC-BY 4.0)','2026-11-13','파일 9개; zip 2.4MB; 미리보기 preview.jpg'),
            ('Cast Iron Stove','assets-3d-lowpoly','cast-iron-stove/cast-iron-stove.zip','3D 모델','stove,prop,furniture,3d','Firefly in the Dusk','https://opengameart.org/content/cast-iron-stove','CC0','optional: Firefly in the Dusk (OpenGameArt)','2026-11-13','파일 4개; zip 124KB; 미리보기 preview.jpg'),
            ('Magic Flameblade - Pixel Art Animation','assets-2d-pixel','magic-flameblade/magic-flameblade.zip','2D 이펙트','magic,sword,flame,effect,animation,pixel','VoyPix','https://opengameart.org/content/%F0%9F%94%A5-magic-flameblade-pixel-art-animation','CC-BY 4.0','required: VoyPix (CC-BY 4.0)','2026-11-13','파일 6개; zip 1.2MB; 마법 검 이펙트 애니메이션; 미리보기 preview.jpg'),
          ]
          with open('catalog.csv','a',newline='',encoding='utf-8') as f:
              w = csv.writer(f, lineterminator='\n')
              for r in rows:
                  w.writerow(r)
          total = sum(1 for _ in open('catalog.csv',encoding='utf-8')) - 1
          sec = """## 2026-11-13 A82 추가 (3팩, 총 %d팩)\n\nA82 라운드에서 OpenGameArt 3D 최신순의 3D 2팩 Shipping Containers·Cast Iron Stove와 2D 최신순의 마법 이펙트 1팩 Magic Flameblade - Pixel Art Animation(모두 opengameart.org)을 수집했습니다. 중복은 카탈로그 저장소 코드 검색(팩 이름 그대로 인용)으로 확인했습니다(Mini Forest·Sofa and Bench·Graveyard Kit·Slash hit 01 Animation VFX는 이미 수록되어 제외; Lyricz 계열 팩은 라이선스 표기가 없어 제외).\n\n| 팩 | 라이선스 |\n| --- | --- |\n| Shipping Containers | CC-BY 4.0 |\n| Cast Iron Stove | CC0 |\n| Magic Flameblade - Pixel Art Animation | CC-BY 4.0 |\n\n종류: 3D 2팩(assets-3d-lowpoly; 소품/환경 2), 2D 마법 이펙트 1팩(assets-2d-pixel). 라이선스: CC0 1팩, CC-BY 4.0 2팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 ingest-pack.yml 수동 실행). 용량: assets-3d-lowpoly 약 623MB, assets-2d-pixel 약 384MB(700MB 미만, 새 저장소 생성 없음). 색인(assets-index*.json)·위키·llms.txt는 직접 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.\n""" % total
          rd = open('README.md',encoding='utf-8').read()
          idx = rd.find('## 2026-11-13 A81')
          if idx < 0:
              idx = rd.find('## 2026-')
          rd = rd[:idx] + sec + rd[idx:]
          open('README.md','w',encoding='utf-8').write(rd)
          entry = """- 2026-11-13 A82: Shipping Containers (miniforall, CC-BY 4.0), Cast Iron Stove (Firefly in the Dusk, CC0), Magic Flameblade - Pixel Art Animation (VoyPix, CC-BY 4.0) (3팩, 총 %d팩; 3D 모델 2(assets-3d-lowpoly), 2D 이펙트 1(assets-2d-pixel)). 소유자 지시의 1회 수집 라운드. OGA 3D 최신순 5~6페이지와 2D 최신순 후보를 카탈로그 저장소 코드 검색으로 중복 확인하고 미수록 3팩을 골랐다. 팩당 zip·pack.md·preview.jpg·LICENSE-SOURCE.txt 생성, 임시 ingest-pack.yml(workflow_dispatch, ImageMagick 설치)로 실행. catalog.csv 행 3개 추가, README 절 추가, 색인은 Actions 자동 갱신.""" % total
          lg = open('docs/log.md',encoding='utf-8').read()
          k = lg.find('A81')
          if k >= 0:
              e = lg.find('\n', k)
              lg = lg[:e+1] + entry + '\n' + lg[e+1:]
          else:
              lg = lg.rstrip('\n') + '\n' + entry + '\n'
          open('docs/log.md','w',encoding='utf-8').write(lg)
          print('total rows', total)
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add catalog.csv README.md docs/log.md
          git commit -m "카탈로그: A82 3팩 추가"
          git push

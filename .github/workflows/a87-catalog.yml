name: A87 카탈로그
on: workflow_dispatch
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 갱신
        run: |
          python3 - <<'PY'
          import csv,io
          p='catalog.csv'
          lines=open(p,encoding='utf-8').read().split('\n')
          hdr=next(csv.reader([lines[0]]))
          rows=[r for r in csv.reader(open(p,encoding='utf-8'))][1:]
          def tmpl(repo):
              c=[r for r in rows if len(r)==len(hdr) and r[hdr.index('repo')]==repo]
              return c[-1]
          def mk(t, name, repo, slug, fname, typ, tags, author, page, lic, note):
              d=dict(zip(hdr,t))
              d['name']=name; d['repo']=repo; d['type']=typ; d['tags']=tags
              d['author']=author; d['source_url']=page; d['license']=lic
              d['added']='2026-11-14'
              d['attribution']='없음 (CC0)' if lic=='CC0' else author+' 표기 (CC-BY 4.0)'
              d['notes']=note
              tf=t.get('file','')
              d['file']=(slug+'/'+fname) if '/' in tf else fname
              if 'preview' in hdr and '/' in t.get('preview',''):
                  d['preview']=slug+'/preview.jpg'
              return d
          t3=tmpl('assets-3d-lowpoly'); ta=tmpl('assets-audio')
          print('T3',t3); print('TA',ta)
          new=[
           mk(t3,'Crates Chests Coins and Barrels Collection','assets-3d-lowpoly-2','crates-chests-coins-barrels','medieval_items.zip','3D','crate,chest,barrel,prop,loot','mabaci','https://opengameart.org/content/crates-chests-coins-and-barrels-collection','CC0','A87 수집; 저장소 내 포함 (902KB); OpenGameArt 3D'),
           mk(t3,'Dungeon interior kit','assets-3d-lowpoly-2','dungeon-interior-kit','dungeon_interior_kit.tar.gz','3D','dungeon,interior,prop','humble squirrel','https://opengameart.org/content/dungeon-interior-kit','CC0','A87 수집; 저장소 내 포함 (1.9MB); OpenGameArt 3D'),
           mk(ta,'Gem collect SFX','assets-audio','gem-collect-sfx','gem-gather-stereo.wav','오디오','sfx,collect,gem,ui','Bobjt','https://opengameart.org/content/gem-collect-sfx','CC0','A87 수집; wav 2 + zip 1; OpenGameArt 효과음'),
          ]
          buf=io.StringIO(); w=csv.writer(buf,lineterminator='\n')
          for d in new: w.writerow([d.get(h,'') for h in hdr])
          open(p,'a',encoding='utf-8').write(buf.getvalue())
          print('appended',len(new),'rows')
          Q=chr(96)
          r=open('README.md',encoding='utf-8').read()
          sec=['## 2026-11-14 A87 추가 (3팩, 총 1871팩)','',
          '![A87 3D/효과음 팩 미리보기](https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/crates-chests-coins-barrels/preview.jpg)','',
          'A87 라운드에서 OpenGameArt의 3D 2팩 Crates Chests Coins and Barrels Collection·Dungeon interior kit와 효과음 1팩 Gem collect SFX를 수집했습니다. 중복은 카탈로그 저장소 코드 검색으로 확인했습니다(medieval_items·dungeon_interior_kit·dungeon interior·Crates Chests 모두 0건, JC Sounds 계열은 이미 수록되어 제외).','',
          '종류: 3D 2팩(assets-3d-lowpoly-2), 효과음 1팩(assets-audio). 라이선스: CC0 3팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 a87-init.yml·a87-ingest.yml 수동 실행). 용량: assets-3d-lowpoly가 약 692MB로 700MB에 근접해 이번 라운드에서 3D 팩은 새 저장소 assets-3d-lowpoly-2에 넣었습니다. 이번 팩은 모두 5MB 이하로 릴리스 첨부 없이 저장소에 직접 포함했습니다.','']
          i=r.find('## 2026-11-14 A86')
          assert i>0, 'A86 heading missing'
          r=r[:i]+'\n'.join(sec)+'\n'+r[i:]
          tl=r.split('\n')
          for n,l in enumerate(tl):
              if l.startswith('| [assets-3d-lowpoly]'):
                  tl.insert(n+1,'| [assets-3d-lowpoly-2](https://github.com/sigco3111/assets-3d-lowpoly-2) | 3D 로우폴리 모델 2호 (새 저장소) | 2팩 (저장소 내 포함) |')
                  break
          r='\n'.join(tl).replace('1868','1871')
          open('README.md','w',encoding='utf-8').write(r)
          s=open('tools/check_sizes.py',encoding='utf-8').read()
          assert '"assets-3d-lowpoly",' in s
          s=s.replace('"assets-3d-lowpoly",','"assets-3d-lowpoly", "assets-3d-lowpoly-2",',1)
          open('tools/check_sizes.py','w',encoding='utf-8').write(s)
          c=open('docs/capacity.md',encoding='utf-8').read()
          c=c+'\n## 2026-11-14 A87 저장소 추가\n\nassets-3d-lowpoly가 A86 라운드에서 약 692MB로 700MB에 근접해, 2026-11-14 A87 라운드에서 3D 2호 저장소 assets-3d-lowpoly-2(공개, 기존 저장소와 같은 README 구성)를 만들었습니다. A87 이후 3D 팩은 assets-3d-lowpoly-2에 올리고 catalog.csv의 repo 열에 그 이름을 적습니다. 기존 저장소의 파일은 삭제·이동하지 않습니다. tools/check_sizes.py의 점검 대상에 새 저장소를 추가했습니다.\n'
          open('docs/capacity.md','w',encoding='utf-8').write(c)
          lg='- 2026-11-14 A87: Crates Chests Coins and Barrels Collection, Dungeon interior kit, Gem collect SFX (모두 CC0, 3팩, 총 1871팩; 3D 2팩은 새 저장소 assets-3d-lowpoly-2, 효과음 1팩은 assets-audio; assets-3d-lowpoly 약 692MB로 700MB 근접해 분리; 새 저장소 README·카탈로그 표·check_sizes.py·capacity.md 갱신; 5MB 넘는 zip 없어 릴리스 미사용; 중복 코드 검색 0건 확인; AI 생성 명시 없음)\n'
          open('docs/log.md','a',encoding='utf-8').write(lg)
          print('done')
          PY
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git add catalog.csv README.md tools/check_sizes.py docs/capacity.md docs/log.md
          git commit -m "카탈로그: A87 3팩 추가"
          git push

name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append rows
        run: |
          python3 - <<'PY'
          import csv, io

          ROWS = [
            ["Asian Girl", "assets-3d-lowpoly", "asian-girl/dorposefbx.zip", "3D 모델",
             "character,rigged,ps2,human,girl,3d", "McPato",
             "https://opengameart.org/content/asian-girl", "CC-BY 4.0",
             "Asian Girl by McPato licensed CC-BY 4.0: https://mcpato.itch.io/asian-girl-ps2-style-character",
             "2026-11-13",
             "FBX 1(리깅, 애니메이션 없음, 약 15.5k 삼각형); zip 1.88MB 페이지 zip 그대로; CC-BY 4.0 단독; CREDITS.txt 동봉; AI 생성 언급 없음"],
            ["Space port kit", "assets-3d-lowpoly", "space-port-kit/space_port_kit_glb.zip", "3D 모델",
             "space,spaceport,rocket,terminal,tower,3d", "Ludrol",
             "https://opengameart.org/content/space-port-kit", "CC-BY 4.0",
             "Made by Ludrol CC-BY-4.0",
             "2026-11-13",
             "GLB zip 57KB + Blend zip 878KB(둘 다 폴더에 보관); CC-BY 4.0 단독; CREDITS.txt 동봉; AI 생성 언급 없음"],
            ["512x512 explosion", "assets-2d-pixel", "releases/download/v4.0/explosion_512.zip", "2D 이펙트",
             "explosion,fire,smoke,fx,2d", "johndekale",
             "https://opengameart.org/content/512x512-explosion", "CC0",
             "없음",
             "2026-11-13",
             "512x512 PNG 프레임 애니메이션(연기 페이드, 투명 배경); zip 7.2MB로 5MB 초과라 Releases v4.0 첨부; CC0 단독; AI 생성 언급 없음"],
          ]

          with open("catalog.csv", "a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              for r in ROWS:
                  w.writerow(r)

          section = """## 2026-11-13 A75 추가 (3팩, 총 1835팩)

A74에서 중복으로 걸러지지 않은 OpenGameArt 3D 최신순 목록에서 3D 2팩 Asian Girl·Space port kit와 2D 최신순에서 폭발 이펙트 1팩 512x512 explosion(모두 opengameart.org)을 수집했습니다. 중복은 라이브러리 검색(https://sigco3111.github.io/game-asset-catalog/)에서 제목으로 확인했고(모두 신규), 각 페이지의 라이선스 표기·파일·AI 언급 여부를 읽어 확인했습니다(AI 생성 언급 없음). 512x512 explosion의 zip은 7.2MB라 Releases v4.0 첨부로 올렸고, 나머지 2팩은 저장소 트리에 올렸습니다.

| 팩 | 라이선스 |
| --- | --- |
| [Asian Girl](https://opengameart.org/content/asian-girl) | CC-BY 4.0 |
| [Space port kit](https://opengameart.org/content/space-port-kit) | CC-BY 4.0 |
| [512x512 explosion](https://opengameart.org/content/512x512-explosion) | CC0 |

종류: 3D 2팩(assets-3d-lowpoly; 캐릭터 1·환경 1), 2D 이펙트 1팩(assets-2d-pixel). 라이선스: CC-BY 4.0 2팩, CC0 1팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 ingest-pack.yml 수동 실행). 색인(assets-index*.json)·위키·llms.txt는 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.

"""
          readme = open("README.md", encoding="utf-8").read()
          readme = readme.replace("1,832개 에셋", "1,835개 에셋")
          marker = "## 2026-11-13 A74 추가 (3팩, 총 1832팩)"
          assert marker in readme
          readme = readme.replace(marker, section + marker, 1)
          open("README.md", "w", encoding="utf-8").write(readme)

          with open("docs/log.md", "a", encoding="utf-8") as f:
              f.write("- 2026-11-13 A75: Asian Girl·Space port kit·512x512 explosion (3팩, 총 1835팩; 3D 2팩 CC-BY 4.0·2D 1팩 CC0)\n")

          print("ok")
          PY
      - name: commit
        run: |
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -am "카탈로그: A75 3팩 추가"
          git push

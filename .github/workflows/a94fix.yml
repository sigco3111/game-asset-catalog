{
  "name": "a94fix",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "run": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "run",
          "run": "printf '%s' '' | base64 -d > /tmp/fix.py\npython3 /tmp/fix.py"
        }
      ]
    }
  }
}

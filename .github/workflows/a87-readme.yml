name: A87 readme
on: workflow_dispatch
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README
        run: |
          python3 - <<'PY'
          r=open('README.md',encoding='utf-8').read()
          if '2026-11-14 A87' in r:
              print('already'); raise SystemExit(0)
          sec=['## 2026-11-14 A87 추가 (3팩, 총 1871팩)','',
          '![A87 3D/효과음 팩 미리보기](https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/crates-chests-coins-barrels/preview.jpg)','',
          'A87 라운드에서 OpenGameArt의 3D 2팩 Crates Chests Coins and Barrels Collection·Dungeon interior kit와 효과음 1팩 Gem collect SFX를 수집했습니다. 중복은 카탈로그 저장소 코드 검색으로 확인했습니다(medieval_items·dungeon_interior_kit·dungeon interior·Crates Chests 모두 0건, JC Sounds 계열은 이미 수록되어 제외).','',
          '종류: 3D 2팩(assets-3d-lowpoly-2), 효과음 1팩(assets-audio). 라이선스: CC0 3팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 a87-init.yml·a87-ingest.yml 수동 실행). 용량: assets-3d-lowpoly가 약 692MB로 700MB에 근접해 이번 라운드에서 3D 팩은 새 저장소 assets-3d-lowpoly-2에 넣었습니다. 이번 팩은 모두 5MB 이하로 릴리스 첨부 없이 저장소에 직접 포함했습니다.','']
          i=r.find('## 2026-11-14 A86')
          print('a86',i)
          if i<0: i=0
          r=r[:i]+chr(10).join(sec)+chr(10)+r[i:]
          tl=r.split(chr(10)); done=False
          for k,l in enumerate(tl):
              if l.startswith('| [assets-3d-lowpoly]'):
                  tl.insert(k+1,'| [assets-3d-lowpoly-2](https://github.com/sigco3111/assets-3d-lowpoly-2) | 3D 로우폴리 모델 2호 (새 저장소) | 2팩 (저장소 내 포함) |')
                  done=True; break
          print('table',done)
          r=chr(10).join(tl).replace('1868','1871')
          open('README.md','w',encoding='utf-8').write(r)
          print('ok')
          PY
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git add README.md
          git commit -m "카탈로그: A87 3팩 추가 (README)"
          git push

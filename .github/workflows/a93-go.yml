name: a93-go
on:
  workflow_dispatch:
    inputs:
      mode:
        description: tidy, upload, catalog or cleanup
        required: true
        default: upload
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        if: inputs.mode == 'upload'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq imagemagick unzip >/dev/null 2>&1 || true
      - name: run
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import os, re, sys, csv, glob, shutil, subprocess, urllib.request
          REPO = os.environ["GITHUB_REPOSITORY"].split("/")[1]
          MODE = os.environ.get("MODE", "upload")
          UA = {"User-Agent": "Mozilla/5.0 a93"}

          def get(u, binary=False, timeout=60):
              req = urllib.request.Request(u, headers=UA)
              data = urllib.request.urlopen(req, timeout=timeout).read()
              return data if binary else data.decode("utf-8", "ignore")

          def gitc(args, cwd=None):
              subprocess.run(["git"] + args, check=True, cwd=cwd)

          def shq(c):
              return subprocess.run(c, shell=True, capture_output=True, text=True).stdout.strip()

          gitc(["config", "user.name", "sigco3111"])
          gitc(["config", "user.email", "sigco3111@gmail.com"])
          print("REPO", REPO, "MODE", MODE)

          def commit_push(msg):
              gitc(["add", "-A"])
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0:
                  gitc(["commit", "-q", "-m", msg])
                  gitc(["push", "origin", "HEAD:main"])
                  print("PUSHED", msg)
              else:
                  print("NOTHING_TO_COMMIT", msg)

          if MODE in ("tidy", "cleanup"):
              files = glob.glob(".github/workflows/a93-*.yml") + glob.glob("a93-*.txt")
              if MODE == "tidy":
                  files = [f for f in files if f != ".github/workflows/a93-go.yml"]
              for f in files:
                  gitc(["rm", "-q", "--ignore-unmatch", "--", f])
                  print("RM", f)
              commit_push("A93: 임시 파일 삭제")
              sys.exit(0)

          if MODE == "catalog":
              if REPO != "game-asset-catalog":
                  sys.exit("catalog mode only in game-asset-catalog")
              print("WC_L (wc -l catalog.csv):", shq("wc -l < catalog.csv"))
              print("WC_LINES_python:", len(open("catalog.csv", encoding="utf-8").read().splitlines()))
              allrows = list(csv.reader(open("catalog.csv", encoding="utf-8", newline="")))
              print("CSV_ROWS_INCL_HEADER", len(allrows), "HEADER0", allrows[0][:3])
              data = [r for r in allrows[1:] if r and r[0].strip()]
              print("DATA_ROWS_EXCL_HEADER", len(data))
              have = {r[0].strip().lower() for r in data}
              have_urls = {r[6].strip() for r in data if len(r) > 6}
              res = []
              for repo in ["assets-3d-lowpoly-2", "assets-2d-pixel"]:
                  try:
                      t = get("https://raw.githubusercontent.com/sigco3111/%s/main/a93-res.txt" % repo)
                  except Exception as e:
                      print("NORES", repo, str(e)[:80]); continue
                  for l in t.splitlines():
                      f = l.split("|")
                      if len(f) >= 9 and f[0].strip():
                          if f[0].strip().lower() in have:
                              print("SKIP dup", f[0]); continue
                          res.append(f)
              if not res:
                  print("NOTHING"); sys.exit(1)
              rows = []
              for f in res:
                  name, rrepo, fl, pv, lic, typ, author, page, tags = f[:9]
                  notes = typ + " 팩; OGA 페이지 라이선스 " + lic + "; 원본 파일 바이트 그대로 보관; 썸네일 " + ("480x480 이하 축소·strip" if pv else "없음")
                  pvurl = ("https://raw.githubusercontent.com/sigco3111/%s/main/%s" % (rrepo, pv)) if pv else ""
                  rows.append([name, rrepo, fl, typ, tags, author, page, lic, "", "2026-11-14", notes, pvurl, ""])
              with open("catalog.csv", "a", newline="", encoding="utf-8") as fo:
                  w = csv.writer(fo, lineterminator="\n")
                  for r in rows:
                      w.writerow(r)
              n = len(rows)
              total = len(data) + n
              n3 = sum(1 for r in rows if r[3].startswith("3D"))
              n2 = n - n3
              rd = open("README.md", encoding="utf-8").read().splitlines()
              sec = ["## 2026-11-14 A93 추가 (" + str(n) + "팩, 총 " + str(total) + "팩)", ""]
              sec.append("A93 라운드: OpenGameArt의 " + ", ".join(r[0] + "(" + r[5] + ", " + r[7] + ")" for r in rows) + "를 수집했습니다. 후보를 러너 안에서 전체 catalog.csv와 이름·출처 URL로 대조해 NEW만 업로드했습니다.")
              sec += ["", "| 팩 | 라이선스 |", "| --- | --- |"]
              sec += ["| " + r[0] + " | " + r[7] + " |" for r in rows]
              sec += ["", "종류: 3D " + str(n3) + "팩, 2D 이펙트 " + str(n2) + "팩. 썸네일: " + ", ".join(r[0] + "=" + ("있음" if r[11] else "없음") for r in rows) + ". 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.", ""]
              idx = None
              for i, l in enumerate(rd):
                  if l.startswith("## 2026-11-14 A92"):
                      idx = i; break
              if idx is None:
                  for i, l in enumerate(rd):
                      if l.startswith("## "):
                          idx = i; break
              rd[idx:idx] = sec
              open("README.md", "w", encoding="utf-8").write("\n".join(rd) + "\n")
              entry = "- 2026-11-14 A93: " + ", ".join(r[0] + " (" + r[5] + ", " + r[7] + ")" for r in rows) + " (" + str(n) + "팩, 총 " + str(total) + "팩; 3D " + str(n3) + ", 2D 이펙트 " + str(n2) + ")."
              with open("docs/log.md", "a", encoding="utf-8") as fo:
                  fo.write("\n" + entry + "\n")
              gitc(["add", "catalog.csv", "README.md", "docs/log.md"])
              gitc(["commit", "-q", "-m", "카탈로그: A93 %d팩 추가" % n])
              gitc(["push", "origin", "HEAD:main"])
              print("CATALOG_DONE", n, "total", total, "3D", n3, "2D", n2)
              sys.exit(0)

          # ---- upload mode (assets-3d-lowpoly-2 / assets-2d-pixel) ----
          if MODE != "upload":
              sys.exit("bad mode")
          cat_body = get("https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/catalog.csv")
          open("/tmp/catalog.csv", "w", encoding="utf-8").write(cat_body)
          crow = list(csv.reader(cat_body.splitlines()))
          have_names = {r[0].strip().lower() for r in crow[1:] if r and r[0].strip()}
          have_urls = {r[6].strip() for r in crow[1:] if len(r) > 6}
          print("CATALOG_DATA_ROWS(raw fetch)", len(crow) - 1)

          if REPO == "assets-3d-lowpoly-2":
              WANT, TYP, ARTTAG = 3, "3D", "3D Art"
              TAGS = "3d,lowpoly,opengameart"
              LISTS = ["https://opengameart.org/art-search-advanced?keys=&field_art_type_tid%5B%5D=10&sort_by=count&sort_order=DESC&page=" + str(p) for p in range(3, 12)]
              EXTRA = []
          elif REPO == "assets-2d-pixel":
              WANT, TYP, ARTTAG = 1, "2D 이펙트", "2D Art"
              TAGS = "effect,vfx,hit,magic,pixel"
              LISTS = ["https://opengameart.org/art-search-advanced?keys=" + k + "&field_art_type_tid%5B%5D=9&sort_by=count&sort_order=DESC" for k in ["hit", "magic", "slash", "explosion", "effect"]]
              EXTRA = ["https://opengameart.org/content/pixel-fx-pack"]
          else:
              sys.exit("upload mode not for this repo")

          print("SIZE_BEFORE_MB du:", shq("du -sm --exclude=.git . | cut -f1"))

          urls = list(EXTRA)
          for L in LISTS:
              try:
                  h = get(L)
              except Exception as ex:
                  print("LISTFAIL", L[-40:], str(ex)[:60]); continue
              for m in re.findall(r'href="/content/([a-z0-9][a-z0-9\-]+)"', h):
                  u = "https://opengameart.org/content/" + m
                  if u not in urls:
                      urls.append(u)
          print("CANDIDATES", len(urls))

          def evaluate(u):
              h = get(u)
              t = re.search(r"<h1[^>]*>(.*?)</h1>", h, re.S)
              name = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", t.group(1))).strip() if t else ""
              i = h.find("License(s)")
              blk = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", h[i:i + 700]).lower()) if i >= 0 else ""
              if re.search(r"cc-by-(sa|nc|nd)", blk):
                  lic = None
              elif "cc0" in blk:
                  lic = "CC0"
              elif "cc-by" in blk:
                  lic = "CC-BY"
              elif re.search(r"\bgpl", blk):
                  lic = "GPL"
              elif re.search(r"\bmit\b", blk):
                  lic = "MIT"
              else:
                  lic = None
              zs = re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+?\.zip)"', h)
              au = re.search(r"/users/([A-Za-z0-9_\-\.]+)", h)
              return dict(name=name, page=u, lic=lic, zips=zs, author=au.group(1) if au else "OpenGameArt", art_ok=(ARTTAG in h), html=h, blk=blk[:120])

          picks = []
          evals = 0
          for u in urls:
              if len(picks) >= WANT or evals >= 160:
                  break
              try:
                  e = evaluate(u); evals += 1
              except Exception as ex:
                  print("EVALFAIL", u[-30:], str(ex)[:60]); continue
              if not e["name"]:
                  continue
              if e["name"].strip().lower() in have_names or e["page"] in have_urls:
                  print("DUP", e["name"]); continue
              if not e["art_ok"]:
                  print("NOTTYPE", e["name"]); continue
              if not e["lic"]:
                  print("LIC-REJECT", e["name"], "|", e["blk"]); continue
              if not e["zips"]:
                  print("NOZIP", e["name"]); continue
              print("PICK", e["name"], e["lic"], e["author"], e["page"])
              picks.append(e)
              have_names.add(e["name"].strip().lower())

          IM = "magick" if shutil.which("magick") else "convert"
          res_lines = []
          for e in picks:
              slug = re.sub(r"[^a-z0-9\-]", "-", e["page"].rsplit("/", 1)[-1].lower()).strip("-")
              d = slug
              if os.path.exists(d):
                  print("SKIP exists", d); continue
              os.makedirs(d)
              zname = slug + ".zip"
              try:
                  data = get(e["zips"][0], binary=True, timeout=240)
              except Exception as ex:
                  print("DLFAIL", e["name"], str(ex)[:80]); shutil.rmtree(d, ignore_errors=True); continue
              open(os.path.join(d, zname), "wb").write(data)
              subprocess.run(["unzip", "-q", "-o", zname], cwd=d)
              imgs = []
              for root, _, fs in os.walk(d):
                  for f in fs:
                      if f.lower().endswith((".png", ".jpg", ".jpeg")):
                          imgs.append(os.path.join(root, f))
              src = None
              for p in imgs:
                  if os.path.basename(p).lower().startswith("preview"):
                      src = p; break
              if not src and imgs:
                  src = max(imgs, key=os.path.getsize)
              if not src:
                  try:
                      m = re.search(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"', e["html"])
                      if m:
                          u2 = m.group(1)
                          if u2.startswith("/"):
                              u2 = "https://opengameart.org" + u2
                          open("/tmp/og.img", "wb").write(get(u2, binary=True))
                          src = "/tmp/og.img"
                  except Exception as ex:
                      print("OGFAIL", str(ex)[:80])
              pv = ""
              if src:
                  try:
                      os.makedirs("previews", exist_ok=True)
                      subprocess.run([IM, src + "[0]", "-resize", "480x480>", "-strip", "/tmp/pv.png"], check=True)
                      if os.path.getsize("/tmp/pv.png") > 200 * 1024:
                          subprocess.run([IM, "/tmp/pv.png", "-quality", "85", "previews/%s.jpg" % slug], check=True)
                          pv = "previews/%s.jpg" % slug
                      else:
                          shutil.copy("/tmp/pv.png", "previews/%s.png" % slug)
                          pv = "previews/%s.png" % slug
                  except Exception as ex:
                      print("THUMBFAIL", e["name"], str(ex)[:80])
              if e["lic"] == "CC-BY":
                  open(os.path.join(d, "CREDITS.txt"), "w", encoding="utf-8").write(
                      e["name"] + "\n\nAuthor: " + e["author"] + "\nSource: " + e["page"] + "\nLicense: CC-BY (see OpenGameArt page)\n")
              gitc(["add", "-A", d])
              gitc(["commit", "-q", "-m", "에셋: %s 추가" % e["name"]])
              if pv:
                  gitc(["add", pv])
                  gitc(["commit", "-q", "-m", "썸네일: %s 추가" % e["name"]])
              res_lines.append("|".join([e["name"], REPO, d + "/" + zname, pv, e["lic"], TYP, e["author"], e["page"], TAGS]))
              print("ADDED", e["name"], "thumb:", pv or "NONE")

          if res_lines:
              open("a93-res.txt", "a", encoding="utf-8").write("\n".join(res_lines) + "\n")
              gitc(["add", "a93-res.txt"])
              gitc(["commit", "-q", "-m", "A93: 결과 기록"])
          gitc(["push", "origin", "HEAD:main"])
          print("SIZE_AFTER_MB du:", shq("du -sm --exclude=.git . | cut -f1"))
          if REPO == "assets-3d-lowpoly-2":
              api = get("https://api.github.com/repos/sigco3111/assets-3d-lowpoly-2")
              m = re.search(r'"size":\s*(\d+)', api)
              print("API_SIZE_MB", round(int(m.group(1)) / 1024, 1) if m else "?")
          print("UPLOAD_DONE", len(res_lines), "packs")
          PY

name: 색인 자동 갱신

on:
  push:
    paths:
      - catalog.csv
      - tools/build_index.py
      - tools/build_wiki.py
  schedule:
    # 6시간마다: push 때 건너뛰었거나 실패한 갱신을 나중에 맞춰 줌
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_index.py가 git log로 catalog.csv의 마지막 커밋을 읽음

      - name: catalog.csv 확인
        id: guard
        # catalog.csv를 삭제 후 이름 변경하는 짧은 순간에 돌면 파일이 없음: 빌드 없이 성공으로 끝냄
        run: |
          if test -f catalog.csv; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::catalog.csv가 없어 이번 실행은 건너뜁니다"
            echo "catalog.csv가 없어 이번 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.x"

      - name: 색인과 위키 생성
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 tools/build_index.py
          python3 tools/build_wiki.py

      - name: 변경이 있으면 커밋
        if: steps.guard.outputs.skip != 'true'
        # GITHUB_TOKEN으로 한 push는 다른 워크플로를 시작하지 않으므로 자기 자신을 다시 부르지 않음
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "색인: 자동 갱신 (catalog.csv 변경)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "push 완료 (시도 ${attempt}/3)"
              exit 0
            fi
            echo "::warning::push 실패 (시도 ${attempt}/3), 다시 시도합니다"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::push가 3번 모두 실패했습니다"
          exit 1

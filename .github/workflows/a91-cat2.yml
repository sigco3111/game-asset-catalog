name: a91-cat2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess

          packs = [
            dict(name="LowPoly Modular Dungeon", repo="assets-3d-lowpoly-2", slug="lowpoly-modular-dungeon",
                 type="3D 환경", tags="dungeon,modular,lowpoly,fantasy", kind="3D",
                 author="quaternius", source="https://opengameart.org/content/lowpoly-modular-dungeon",
                 lic="CC0", attr="",
                 notes="던전 모듈형 로우폴리 세트; OGA 페이지 라이선스 CC0; 원본 zip 바이트 그대로 보관; 썸네일 preview.png는 OGA 페이지 미리보기 이미지에서 480x480 이하로 축소·strip"),
            dict(name="Weapon Box pack 2", repo="assets-3d-lowpoly-2", slug="weapon-box-pack-2",
                 type="3D 소품", tags="weapon,box,crate,props,game-ready,lowpoly", kind="3D",
                 author="Yughues", source="https://opengameart.org/content/weapon-box-pack-2",
                 lic="CC0", attr="",
                 notes="무기 상자/크레이트 3D 소품 세트; OGA 페이지 라이선스 CC0; 원본 7z 바이트 그대로 보관; 썸네일 preview는 팩 내 텍스처 이미지에서 480x480 이하로 축소·strip",
                 file="weapon-box-pack-2/weapon-box-pack-2.7z"),
            dict(name="More Explosions", repo="assets-2d-pixel", slug="more-explosions",
                 type="2D 이펙트", tags="effect,explosion,animation,vfx,spritesheet", kind="2D 이펙트",
                 author="StumpyStrust", source="https://opengameart.org/content/more-explosions",
                 lic="CC0", attr="",
                 notes="폭발 이펙트 애니메이션 모음; OGA 페이지 라이선스 CC0; 원본 zip 바이트 그대로 보관; 썸네일 preview는 OGA 페이지 미리보기에서 480x480 이하로 축소·strip"),
            dict(name="Water Magic Effect", repo="assets-2d-pixel", slug="water-magic-effect",
                 type="2D 이펙트", tags="effect,water,magic,vfx,spritesheet,animation", kind="2D 이펙트",
                 author="Cethiel", source="https://opengameart.org/content/water-magic-effect",
                 lic="CC0", attr="",
                 notes="물 마법 이펙트 애니메이션; OGA 페이지 라이선스 CC0; 원본 zip 바이트 그대로 보관; 썸네일 preview는 OGA 페이지 미리보기에서 480x480 이하로 축소·strip"),
          ]

          def code(u):
              r = subprocess.run(["curl","-s","-o","/dev/null","-w","%{http_code}","-I",u], capture_output=True, text=True)
              return r.stdout.strip()

          body = open("catalog.csv", encoding="utf-8").read()
          lines = body.splitlines()

          added = []
          for p in packs:
              if (p["name"] + ",") in body or ('"' + p["name"] + '",') in body:
                  print("SKIP duplicate", p["name"]); continue
              zipu = f"https://raw.githubusercontent.com/sigco3111/{p['repo']}/main/" + (p.get("file") or f"{p['slug']}/{p['slug']}.zip")
              if code(zipu) != "200":
                  print("SKIP missing", zipu); continue
              pv = ""
              for ext in ("png","jpg"):
                  cand = f"https://raw.githubusercontent.com/sigco3111/{p['repo']}/main/{p['slug']}/preview.{ext}"
                  if code(cand) == "200":
                      pv = cand; break
              added.append([p["name"], p["repo"], p.get("file") or f"{p['slug']}/{p['slug']}.zip", p["type"], p["tags"], p["author"],
                            p["source"], p["lic"], p["attr"], "2026-11-14", p["notes"], pv, ""])
              print("ADD", p["name"], "preview" if pv else "NOPREVIEW")

          if not added:
              print("NOTHING ADDED"); raise SystemExit(1)

          with open("catalog.csv","a",newline="",encoding="utf-8") as f:
              w = csv.writer(f, lineterminator="\n")
              for r in added:
                  w.writerow(r)

          n = len(added)
          total = len([l for l in lines if l.strip()]) - 1 + n

          names = [r[0] for r in added]
          n3 = sum(1 for r in added if r[3].startswith("3D"))
          n2 = n - n3

          rd = open("README.md", encoding="utf-8").read().splitlines()
          sec = [f"## 2026-11-14 A91 추가 ({n}팩, 총 {total}팩)", ""]
          sec.append("A91 라운드에서 OpenGameArt의 " + ", ".join(f"{r[0]}({r[5]}, {r[7]})" for r in added) + "를 수집했습니다. 후보였던 LowPoly Buildings, 2D Spell Effects, sparkling fireball effect, 3TD Furniture Pack, Dungeon Arena, Water Magic Effect 등은 업로드 전 catalog.csv 이름 대조에서 이미 수록된 팩으로 확인되어 제외했습니다.")
          sec += ["", "| 팩 | 라이선스 |", "| --- | --- |"]
          sec += [f"| {r[0]} | {r[7]} |" for r in added]
          sec += ["", f"종류: 3D {n3}팩, 2D 이펙트 {n2}팩. 썸네일: " + ", ".join(f"{r[0]}=있음" for r in added) + ". 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.", ""]
          idx = None
          for i, l in enumerate(rd):
              if l.startswith("## 2026-11-14 A90 추가"):
                  idx = i; break
          if idx is None:
              for i, l in enumerate(rd):
                  if l.startswith("## "):
                      idx = i; break
          rd[idx:idx] = sec
          open("README.md","w",encoding="utf-8").write("\n".join(rd) + "\n")

          entry = f"- 2026-11-14 A91: " + ", ".join(f"{r[0]} ({r[5]}, {r[7]})" for r in added) + f" ({n}팩, 총 {total}팩; 3D {n3}, 2D 이펙트 {n2}). 후보는 업로드 전 catalog.csv 이름 대조로 중복 제거."
          with open("docs/log.md","a",encoding="utf-8") as f:
              f.write("\n" + entry + "\n")
          open("a91n.txt","w").write(str(n))
          print("DONE", n, total)
          PY
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          N=$(cat a91n.txt); rm -f a91n.txt
          git add -A
          git commit -q -m "카탈로그: A91 ${N}팩 추가"
          git push origin HEAD:main

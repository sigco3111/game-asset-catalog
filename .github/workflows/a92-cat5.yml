name: a92-cat3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess

          packs = [
                    dict(name="2D Explosion Animations #2 | Frame by frame", repo="assets-2d-pixel", slug="2d-explosion-animations-2-frame-by-frame", typ="2D 이펙트", tags="explosion,effect,vfx,spritesheet", author="Sinestesia", src="https://opengameart.org/content/2d-explosion-animations-2-frame-by-frame", lic="CC0"),
          ]
          def code(u):
              return subprocess.run(["curl","-s","-o","/dev/null","-w","%{http_code}","-I",u], capture_output=True, text=True).stdout.strip()

          body = open("catalog.csv", encoding="utf-8").read()
          lines = body.splitlines()

          added = []
          for p in packs:
              if (p["name"] + ",") in body or ('"' + p["name"] + '",') in body:
                  print("SKIP dup", p["name"]); continue
              base = "https://raw.githubusercontent.com/sigco3111/" + p["repo"] + "/main/"
              ext = ""
              for e in ("zip","7z","rar","blend"):
                  if code(base + p["slug"] + "/" + p["slug"] + "." + e) == "200":
                      ext = e; break
              if not ext:
                  print("SKIP nofile", p["name"]); continue
              pv = ""
              for e in ("png","jpg"):
                  u = base + "previews/" + p["slug"] + "." + e
                  if code(u) == "200":
                      pv = u; break
              notes = p["typ"] + " 팩; OGA 페이지 라이선스 " + p["lic"] + "; 원본 파일 바이트 그대로 보관; 썸네일 preview는 " + ("팩 내 이미지/원본 페이지 미리보기를 480x480 이하로 축소·strip" if pv else "없음")
              added.append([p["name"], p["repo"], p["slug"] + "/" + p["slug"] + "." + ext, p["typ"], p["tags"], p["author"], p["src"], p["lic"], "", "2026-11-14", notes, pv, ""])
              print("ADD", p["name"], ext, "preview" if pv else "NOPREVIEW")

          if not added:
              print("NOTHING ADDED"); raise SystemExit(1)

          with open("catalog.csv","a",newline="",encoding="utf-8") as f:
              w = csv.writer(f, lineterminator="\n")
              for r in added: w.writerow(r)

          n = len(added)
          total = len([l for l in lines if l.strip()]) - 1 + n
          n3 = sum(1 for r in added if r[3].startswith("3D"))
          n2 = n - n3

          rd = open("README.md", encoding="utf-8").read().splitlines()
          sec = ["## 2026-11-14 A92 추가 (3부 " + str(n) + "팩, 총 " + str(total) + "팩)", ""]
          sec.append("A92 라운드 후속분: OpenGameArt " + ", ".join(r[0] + "(" + r[5] + ", " + r[7] + ")" for r in added) + ". 후보 26개를 카탈로그 이름 대조(assets-index 기반 catalog.csv)로 걸러낸 뒤 업로드한 팩입니다.")
          sec += ["", "| 팩 | 라이선스 |", "| --- | --- |"]
          sec += ["| " + r[0] + " | " + r[7] + " |" for r in added]
          sec += ["", "종류: 3D " + str(n3) + "팩, 2D 이펙트 " + str(n2) + "팩. 썸네일: " + ", ".join(r[0] + "=" + ("있음" if r[11] else "없음") for r in added) + ".", ""]
          idx = None
          for i, l in enumerate(rd):
              if l.startswith("## 2026-11-14 A92 추가"):
                  idx = i; break
          rd[idx:idx] = sec
          open("README.md","w",encoding="utf-8").write("\n".join(rd) + "\n")

          entry = "- 2026-11-14 A92 (2부): " + ", ".join(r[0] + " (" + r[5] + ", " + r[7] + ")" for r in added) + " (" + str(n) + "팩, 총 " + str(total) + "팩; 3D " + str(n3) + ", 2D 이펙트 " + str(n2) + ")."
          with open("docs/log.md","a",encoding="utf-8") as f:
              f.write("\n" + entry + "\n")
          open("a92n.txt","w").write(str(n))
          print("DONE", n, total)

          PY
          git config user.name sigco3111
          git config user.email sigco3111@gmail.com
          N=$(cat a92n.txt); rm -f a92n.txt
          git rm -q --ignore-unmatch a92-probe.txt
          git add -A
          git commit -q -m "카탈로그: A92 ${N}팩 추가"
          git push origin HEAD:main

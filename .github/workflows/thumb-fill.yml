name: 썸네일 채우기 (임시)
on: push
permissions:
  contents: write
  actions: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import csv, os, re, io, json, base64, subprocess

          TOKEN = os.environ["GH_TOKEN"]
          USER = "sigco3111"
          REPO = "sigco3111/game-asset-catalog"
          API = "https://api.github.com"

          def api(path, method="GET", payload=None):
              cmd = ["curl", "-sS", "--max-time", "120", "-X", method,
                     "-H", "Authorization: Bearer " + TOKEN,
                     "-H", "Accept: application/vnd.github+json", API + path]
              data = None
              if payload is not None:
                  cmd = cmd + ["-H", "Content-Type: application/json", "--data-binary", "@-"]
                  data = json.dumps(payload)
              r = subprocess.run(cmd, input=data, capture_output=True, text=True)
              try:
                  return json.loads(r.stdout or "{}")
              except Exception:
                  return {"_raw": r.stdout[:200]}

          def file_sha(repo, path):
              r = api("/repos/" + USER + "/" + repo + "/contents/" + path)
              return r.get("sha") if isinstance(r, dict) else None

          def slugify(s):
              s = re.sub(r"[^0-9a-z가-힣]+", "-", s.lower()).strip("-")
              return s or "pack"

          raw = open("catalog.csv", encoding="utf-8").read()
          had_nl = raw.endswith("\n")
          lines = raw.split("\n")
          if lines and lines[-1] == "":
              lines.pop()
          rows = lines[1:]
          filled = []
          for i, line in enumerate(rows):
              if not line.strip():
                  continue
              try:
                  f = next(csv.reader([line]))
              except Exception:
                  continue
              while len(f) < 16:
                  f.append("")
              name, repo, filep, added, notes, prev = f[0], f[1], f[2], f[9], f[10], f[11].strip()
              if added < "2026-11-11" or repo == "assets-audio" or prev:
                  continue
              if "previews/" in notes:
                  continue
              cands = []
              if "/" in filep and not filep.startswith("releases/"):
                  cands.append("previews/" + filep.split("/")[0] + ".png")
                  cands.append("previews/" + filep.split("/")[0] + ".jpg")
              cands.append("previews/" + slugify(name) + ".png")
              cands.append("previews/" + slugify(name) + ".jpg")
              hit = None
              for c in cands:
                  if file_sha(repo, c):
                      hit = c
                      break
              if not hit:
                  continue
              f[11] = hit
              buf = io.StringIO()
              csv.writer(buf, lineterminator="").writerow(f)
              rows[i] = buf.getvalue()
              filled.append(name + " | " + repo + " | " + hit)

          print("filled", len(filled))
          for x in filled:
              print("-", x)

          meta = api("/repos/" + REPO + "/contents/catalog.csv")
          if filled and isinstance(meta, dict) and meta.get("sha"):
              newcsv = "\n".join([lines[0]] + rows) + ("\n" if had_nl else "")
              api("/repos/" + REPO + "/contents/catalog.csv", "PUT",
                  {"message": "썸네일: 미리보기 열 " + str(len(filled)) + "행 채우기",
                   "branch": "main", "sha": meta["sha"],
                   "content": base64.b64encode(newcsv.encode("utf-8")).decode()})
              api("/repos/" + REPO + "/actions/workflows/rebuild-index.yml/dispatches", "POST", {"ref": "main"})

          m = api("/repos/" + REPO + "/contents/thumb-report2.md")
          if isinstance(m, dict) and m.get("sha"):
              pass
          print("done")
          PY

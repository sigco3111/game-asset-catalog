name: A87 csv
on: workflow_dispatch
permissions:
  contents: write
jobs:
  csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 행
        run: |
          python3 - <<'PY'
          import csv,io
          p='catalog.csv'
          hdr=next(csv.reader(open(p,encoding='utf-8')))
          rows=list(csv.reader(open(p,encoding='utf-8')))[1:]
          print('cols',len(hdr),'rows',len(rows))
          def td(repo):
              c=[dict(zip(hdr,r)) for r in rows if len(r)==len(hdr) and r[hdr.index('repo')]==repo]
              return c[-1]
          t3=td('assets-3d-lowpoly'); ta=td('assets-audio')
          print('t3file',t3.get('file','')[:60],'preview',t3.get('preview','')[:40])
          def mk(t,name,repo,slug,fname,typ,tags,author,page,lic,note):
              d=dict(t)
              d['name']=name; d['repo']=repo; d['type']=typ; d['tags']=tags
              d['author']=author; d['source_url']=page; d['license']=lic
              d['added']='2026-11-14'; d['notes']=note
              d['attribution']='없음 (CC0)' if lic=='CC0' else author+' 표기 (CC-BY 4.0)'
              d['file']=(slug+'/'+fname) if '/' in t.get('file','') else fname
              if 'preview' in hdr and '/' in t.get('preview',''): d['preview']=slug+'/preview.jpg'
              return d
          new=[
           mk(t3,'Crates Chests Coins and Barrels Collection','assets-3d-lowpoly-2','crates-chests-coins-barrels','medieval_items.zip','3D','crate,chest,barrel,prop,loot','mabaci','https://opengameart.org/content/crates-chests-coins-and-barrels-collection','CC0','A87 수집; 저장소 내 포함 (902KB); OpenGameArt 3D'),
           mk(t3,'Dungeon interior kit','assets-3d-lowpoly-2','dungeon-interior-kit','dungeon_interior_kit.tar.gz','3D','dungeon,interior,prop','humble squirrel','https://opengameart.org/content/dungeon-interior-kit','CC0','A87 수집; 저장소 내 포함 (1.9MB); OpenGameArt 3D'),
           mk(ta,'Gem collect SFX','assets-audio','gem-collect-sfx','gem-gather-stereo.wav','오디오','sfx,collect,gem,ui','Bobjt','https://opengameart.org/content/gem-collect-sfx','CC0','A87 수집; wav 2 + zip 1; OpenGameArt 효과음'),
          ]
          have={r[hdr.index('name')] for r in rows if len(r)==len(hdr)}
          buf=io.StringIO(); w=csv.writer(buf,lineterminator=chr(10))
          n=0
          for d in new:
              if d['name'] in have:
                  print('dup',d['name']); continue
              w.writerow([d.get(h,'') for h in hdr]); n+=1
              print('ROW',d['name'],'|',d['repo'],'|',d['file'])
          open(p,'a',encoding='utf-8').write(buf.getvalue())
          print('rows_added',n)
          PY
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git add catalog.csv
          git commit -m "카탈로그: A87 3팩 추가"
          git push

name: catalog-append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append
        run: |
          python3 - <<'PY'
          import csv

          ROWS = [
           ["Rail Post","assets-3d-lowpoly","rail-post/post.zip","3D 모델","rail,post,fence,wood,dungeon,3d,lowpoly","Q2DENJINDREW","https://opengameart.org/content/rail-post","CC0","없음","2026-11-13","zip 14.8KB; CC0 단독; AI 생성 언급 없음"],
           ["Humanoid SoulsLike Animations","assets-3d-lowpoly","humanoid-soulslike-animations/fistweaponanimationpack.zip","3D 모델","soulslike,character,animation,blend,fist,sword,3d,lowpoly","Gres","https://opengameart.org/content/humanoid-soulslike-animations","CC0","없음","2026-11-13","blend 1.7MB·2.4MB와 zip 3.2MB 함께 수록; CC0 단독; AI 생성 언급 없음"],
           ["B-chan","assets-3d-lowpoly","b-chan/bchan_edited.blend","3D 모델","character,female,rigged,chibi,blend,3d","hardboileduser (원작 AmarilloArts)","https://opengameart.org/content/b-chan","CC0","없음","2026-11-13","blend 23.6MB·rig 도구 zip 58KB; CC0 단독; AI 생성 언급 없음"],
           ["IgnisForge Free SFX Sampler","assets-audio","ignisforge-free-sfx-sampler/ignisforge-oga-sampler-cc0.zip","효과음","sfx,retro,ui,sci-fi,glitch,synth","ignisforge","https://opengameart.org/content/ignisforge-free-sfx-sampler-43-synthesized-retro-sound-effects","CC0","없음","2026-11-13","zip 1.2MB, 43개 효과음; CC0 단독; AI 미사용 명시(자체 합성)"],
          ]

          with open("catalog.csv", "a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              for r in ROWS:
                  w.writerow(r)

          S = "\n".join([
           "## 2026-11-13 A77 추가 (4팩, 총 1842팩)",
           "",
           "A77 라운드에서 OpenGameArt 3D 최신순의 3D 3팩 Rail Post·Humanoid SoulsLike Animations·B-chan과 효과음 최신순의 IgnisForge Free SFX Sampler(모두 opengameart.org)를 수집했습니다. 중복은 라이브러리 검색(https://sigco3111.github.io/game-asset-catalog/)에서 제목으로 확인했습니다(모두 신규; Swinging blade trap·Wooden crate·Germanic style castle·desert castle/tower·Chibi Neko·Bird Bath·Asian Girl·Bald Man·Basic Female·Pine Tree·Mushroom Enemy·Mini Shop는 이미 수록되어 제외, A5 Carbine·Low Poly Medieval Models 163 CC0는 파일 미제공으로 제외). 4팩 모두 CC0이고 모두 5MB 기준 이하 zip 또는 25MB 이하 원본 파일이라 저장소 트리에 올렸습니다.",
           "",
           "| 팩 | 라이선스 |",
           "| --- | --- |",
           "| [Rail Post](https://opengameart.org/content/rail-post) | CC0 |",
           "| [Humanoid SoulsLike Animations](https://opengameart.org/content/humanoid-soulslike-animations) | CC0 |",
           "| [B-chan](https://opengameart.org/content/b-chan) | CC0 |",
           "| [IgnisForge Free SFX Sampler](https://opengameart.org/content/ignisforge-free-sfx-sampler-43-synthesized-retro-sound-effects) | CC0 |",
           "",
           "종류: 3D 3팩(assets-3d-lowpoly; 소품 1·애니메이션 1·캐릭터 1), 효과음 1팩(assets-audio). 라이선스: CC0 4팩. AI 생성 명시 팩 없음. 팩당 1커밋(에셋: <팩 이름> 추가, 임시 워크플로 ingest-pack.yml 수동 실행). 용량: assets-3d-lowpoly 약 590MB, assets-audio 약 370MB(모두 700MB 미만), 새 저장소 생성 없음. 색인(assets-index*.json)·위키·llms.txt는 손대지 않고 Actions 자동 갱신에 맡김. '천하삼분 게임 에셋 56'은 수집 대상이 아님.",
           "",
          ])

          readme = open("README.md", encoding="utf-8").read()
          assert "1,838개 에셋" in readme
          readme = readme.replace("1,838개 에셋", "1,842개 에셋")
          marker = "## 2026-11-13 A76 추가 (3팩, 총 1838팩)"
          assert marker in readme
          readme = readme.replace(marker, S + marker, 1)
          open("README.md", "w", encoding="utf-8").write(readme)

          with open("docs/log.md", "a", encoding="utf-8") as f:
              f.write("- 2026-11-13 A77: Rail Post·Humanoid SoulsLike Animations·B-chan·IgnisForge Free SFX Sampler (4팩, 총 1842팩; 3D 3팩·효과음 1팩, 모두 CC0)\n")

          print("ok")
          PY
      - name: commit
        run: |
          git add -A
          git -c user.name=sigco3111 -c user.email=sigco3111@users.noreply.github.com commit -m "카탈로그: A77 4팩 추가"
          git push

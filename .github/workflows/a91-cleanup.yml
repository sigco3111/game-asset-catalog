name: a91-cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cleanup
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@gmail.com"
          git rm -q --ignore-unmatch .github/workflows/a91-*.yml
          git rm -q --ignore-unmatch scripts/a91-*
          git commit -q -m "A91: 임시 파일 삭제" || true
          git push origin HEAD:main

name: catalog-append
on: workflow_dispatch
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/rows.py
      - run: python3 .github/scripts/docs.py
      - run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add catalog.csv README.md docs/log.md
          git commit -m "카탈로그: A84 3팩 추가"
          git push
